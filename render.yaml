services:
  - type: web
    name: ashley-swinehart-portfolio-site
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      # SPA fallback: client-side routes resolve to index.html.
      # Render serves real files first, so /assets/* is unaffected.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
